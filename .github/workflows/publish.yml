name: Publish stable images
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image directory to publish, or all for every patch image
        required: true
        type: string
permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: stable-${{ inputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_IMAGE: ${{ inputs.image }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$SELECTED_IMAGE" = all ]; then
            for file in images/*/Dockerfile; do
              bash scripts/image.sh publish "$(basename "$(dirname "$file")")"
            done
          else
            bash scripts/image.sh publish "$SELECTED_IMAGE"
          fi
